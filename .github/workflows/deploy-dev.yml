name: 🧪 Deploy DEV (Oracle VPS)

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 187.124.178.155 >> ~/.ssh/known_hosts

      - name: 🚢 Deploy to DEV (Oracle 187.124.178.155)
        run: |
          ssh root@187.124.178.155 "
            set -e
            cd /opt/clawhub-dashboard
            echo '📦 Pulling latest code (dev)...'
            git fetch origin
            git checkout dev || git checkout -b dev origin/dev
            git pull origin dev
            echo '🔨 Rebuilding container...'
            docker compose up -d --build
            echo '✅ DEV deployment complete!'
            docker ps --filter name=clawhub-dashboard --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          "
