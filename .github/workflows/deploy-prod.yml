name: 🚀 Deploy PROD (Hostinger VPS)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 158.180.60.61 >> ~/.ssh/known_hosts

      - name: 🚢 Deploy to PROD (Hostinger 158.180.60.61)
        run: |
          ssh ubuntu@158.180.60.61 "
            set -e
            cd /data/clawhub-dashboard
            echo '📦 Pulling latest code (master)...'
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/TheCabbageBaggage/clawhub-dashboard.git master
            echo '🔨 Rebuilding container...'
            docker compose up -d --build
            echo '✅ PROD deployment complete!'
            docker ps --filter name=clawhub-dashboard --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          "
