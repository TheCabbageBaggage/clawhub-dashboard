name: 🚀 Auto-Deploy ClawHub Dashboard

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 187.124.178.155 >> ~/.ssh/known_hosts

      - name: 🚢 Deploy via Docker Compose
        run: |
          ssh root@187.124.178.155 "
            set -e
            cd /opt/clawhub-dashboard
            echo '📦 Pulling latest code...'
            git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/TheCabbageBaggage/clawhub-dashboard.git master
            echo '🔨 Rebuilding container...'
            docker compose up -d --build
            echo '✅ Deployment complete!'
            docker ps --filter name=clawhub-dashboard --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          "
