name: 🚀 Auto-Deploy ClawHub Dashboard

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 158.180.60.61 >> ~/.ssh/known_hosts
          # Also add for root (used by sudo git pull)
          sudo ssh-keyscan -H github.com >> /root/.ssh/known_hosts 2>/dev/null || true

      - name: 🚢 Deploy via Docker Compose
        run: |
          ssh ubuntu@158.180.60.61 "
            set -e
            cd /data/clawhub-dashboard
            echo '📦 Pulling latest code...'
            sudo GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=no' git pull origin master
            echo '🔨 Rebuilding container...'
            sudo docker compose up -d --build
            echo '✅ Deployment complete!'
            sudo docker ps --filter name=clawhub-dashboard --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          "
