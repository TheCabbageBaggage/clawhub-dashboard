<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan — Operations Hub</title>
<style>
:root,
[data-theme="dark"] {
  --bg: #0a0e14; --bg2: #11161e; --bg3: #1a2230;
  --card: #141c26; --card-hover: #1a2432;
  --primary: #2C5F7C; --primary-glow: rgba(44,95,124,0.25);
  --secondary: #1A3440; --accent: #3D8B8B;
  --accent-glow: rgba(61,139,139,0.2);
  --text: #e0e4ea; --text2: #8892a8; --text3: #5a6478;
  --success: #10b981; --warn: #f59e0b; --danger: #ef4444;
  --pending: #6366f1;
  --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.1);
  --radius: 16px; --radius-sm: 10px; --radius-xs: 6px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  --nav-bg: rgba(10,14,20,0.85);
  --hero-gradient: linear-gradient(135deg, #1A3440 0%, #2C5F7C 100%);
  --hero-text: #fff; --hero-text2: rgba(255,255,255,0.7);
}
[data-theme="light"] {
  --bg: #f5f6f8; --bg2: #ffffff; --bg3: #e8ecf1;
  --card: #ffffff; --card-hover: #f0f3f6;
  --primary: #2C5F7C; --primary-glow: rgba(44,95,124,0.12);
  --secondary: #1A3440; --accent: #2C5F7C;
  --accent-glow: rgba(44,95,124,0.1);
  --text: #1a1d27; --text2: #5a6478; --text3: #8892a8;
  --success: #10b981; --warn: #f59e0b; --danger: #ef4444;
  --pending: #6366f1;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.12);
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  --nav-bg: rgba(245,246,248,0.9);
  --hero-gradient: linear-gradient(135deg, #1A3440 0%, #2C5F7C 100%);
  --hero-text: #fff; --hero-text2: rgba(255,255,255,0.7);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.nav {
  position: sticky; top:0; z-index:100;
  background: var(--nav-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between;
  height: 60px;
}
.nav-brand { display: flex; align-items: center; gap: 0.6rem; }
.nav-brand a {
  text-decoration: none; color: var(--text2); font-size: 1.1rem;
  padding: 0.3rem 0.5rem; border-radius: 6px; transition: var(--transition);
}
.nav-brand a:hover { background: var(--bg3); color: var(--accent); }
.nav-brand .title { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
.nav-right { display: flex; align-items: center; gap: 0.6rem; }
.theme-toggle {
  width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text2); font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
.hero {
  background: var(--hero-gradient); padding: 2.5rem 2rem; text-align: center;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; top: -40%; right: -20%;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(61,139,139,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.hero h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; color: var(--hero-text); letter-spacing: -0.03em; }
.hero p { font-size: 0.95rem; color: var(--hero-text2); margin-top: 0.5rem; }
.main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

/* Stats bar */
.stats-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem; margin-bottom: 2rem;
}
.stat-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 1rem; text-align: center;
}
.stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.25rem; }

/* Week layout */
.week { margin-bottom: 2rem; }
.week-header {
  display: flex; align-items: center; gap: 0.75rem;
  margin-bottom: 1rem; padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}
.week-num {
  font-size: 0.75rem; font-weight: 700; padding: 3px 10px;
  border-radius: 6px; background: var(--accent); color: #fff;
}
.week-label { font-size: 0.9rem; font-weight: 600; color: var(--text); }
.week-progress { font-size: 0.7rem; color: var(--text3); margin-left: auto; }

.day-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 0.75rem;
}
.day-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 1rem;
  transition: var(--transition);
}
.day-card:hover { border-color: var(--accent); }
.day-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0.5rem;
}
.day-name { font-size: 0.8rem; font-weight: 700; color: var(--text); }
.day-count { font-size: 0.65rem; color: var(--text3); }

.task-list { list-style: none; }
.task-item {
  display: flex; align-items: flex-start; gap: 0.4rem;
  padding: 0.3rem 0; font-size: 0.75rem; color: var(--text2);
  border-bottom: 1px solid var(--border);
}
.task-item:last-child { border-bottom: none; }
.task-status {
  width: 7px; height: 7px; border-radius: 50%; margin-top: 0.3rem;
  flex-shrink: 0;
}
.status-done { background: var(--success); }
.status-progress { background: var(--warn); animation: pulse 1.5s ease-in-out infinite; }
.status-todo { background: var(--text3); }
.status-blocked { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.task-desc { flex: 1; }
.task-desc.done { text-decoration: line-through; opacity: 0.6; }

/* Runs table */
.section { margin-top: 2rem; }
.section h2 {
  font-size: 1rem; font-weight: 600; color: var(--text);
  margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem;
}
.data-table {
  width: 100%; border-collapse: collapse;
  font-size: 0.8rem; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  overflow: hidden;
}
.data-table th {
  text-align: left; padding: 0.6rem 0.8rem;
  background: var(--bg3); color: var(--text2);
  font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
}
.data-table td {
  padding: 0.5rem 0.8rem; border-top: 1px solid var(--border);
  color: var(--text2);
}

.footer {
  text-align: center; padding: 1.5rem; color: var(--text3);
  font-size: 0.72rem; border-top: 1px solid var(--border); margin-top: 2rem;
}
.footer a { color: var(--text3); }

.loading { text-align: center; padding: 3rem; color: var(--text3); }
.error { text-align: center; padding: 3rem; color: var(--danger); }

@media (max-width: 600px) {
  .nav { padding: 0 1rem; }
  .hero { padding: 1.75rem 1rem; }
  .main { padding: 1.5rem 1rem; }
  .day-grid { grid-template-columns: 1fr; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <a href="/" title="Back to Command Center">←</a>
    <span class="title">📋 Plan</span>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode" aria-label="Toggle theme">☀️</button>
  </div>
</nav>

<div class="hero">
  <h1>Clowie Task Engine</h1>
  <p>Live Task Status — powered by SQLite Task Engine</p>
</div>

<div class="main">

  <!-- Stats Bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-value" id="statTotal">—</div><div class="stat-label">Total Tasks</div></div>
    <div class="stat-card"><div class="stat-value" id="statPending">—</div><div class="stat-label">Pending</div></div>
    <div class="stat-card"><div class="stat-value" id="statActive">—</div><div class="stat-label">In Progress</div></div>
    <div class="stat-card"><div class="stat-value" id="statDone">—</div><div class="stat-label">Done</div></div>
    <div class="stat-card"><div class="stat-value" id="statRuns">—</div><div class="stat-label">Total Runs</div></div>
    <div class="stat-card"><div class="stat-value" id="statCost">—</div><div class="stat-label">Total Cost</div></div>
  </div>

  <!-- Task Grid -->
  <div id="taskGrid"><div class="loading">Loading tasks…</div></div>

  <!-- Recent Runs -->
  <div class="section">
    <h2>🔄 Recent Runs</h2>
    <table class="data-table">
      <thead><tr><th>Task</th><th>Model</th><th>Status</th><th>Tokens In</th><th>Tokens Out</th><th>Cost</th><th>Started</th></tr></thead>
      <tbody id="runsBody"><tr><td colspan="7" class="loading">Loading…</td></tr></tbody>
    </table>
  </div>

</div>

<div class="footer">
  ClawHub Task Engine · Live from SQLite · <span id="updateTime">—</span>
</div>

<script>
// Auth check
async function checkAuth() {
  try {
    const r = await fetch('/api/auth-status');
    const d = await r.json();
    if (!d.authenticated) { window.location.href = '/login'; return false; }
    return true;
  } catch(e) { window.location.href = '/login'; return false; }
}

// Theme toggle
(function() {
  const saved = localStorage.getItem('clawhub-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeToggle');
  btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
  btn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    btn.textContent = next === 'light' ? '🌙' : '☀️';
    localStorage.setItem('clawhub-theme', next);
  });
})();

// Status mapping
const statusClass = {
  'done': 'status-done',
  'in_progress': 'status-progress',
  'pending': 'status-todo',
  'blocked': 'status-blocked'
};

// Group tasks by week
function groupByWeek(tasks) {
  const weeks = {};
  for (const t of tasks) {
    const w = t.week || 'Unknown';
    if (!weeks[w]) weeks[w] = [];
    weeks[w].push(t);
  }
  return weeks;
}

// Render tasks
function renderTasks(tasks) {
  const grid = document.getElementById('taskGrid');
  const weeks = groupByWeek(tasks);
  const weekKeys = Object.keys(weeks).sort();
  
  if (weekKeys.length === 0) {
    grid.innerHTML = '<div class="loading">No tasks found</div>';
    return;
  }

  let html = '';
  for (const wk of weekKeys) {
    const weekTasks = weeks[wk];
    const done = weekTasks.filter(t => t.status === 'done').length;
    const total = weekTasks.length;
    const pct = total > 0 ? Math.round(done / total * 100) : 0;
    
    html += `<div class="week">
      <div class="week-header">
        <span class="week-num">${wk}</span>
        <span class="week-label">${wk}</span>
        <span class="week-progress">${done}/${total} done (${pct}%)</span>
      </div>
      <div class="day-grid">`;
    
    // Group by category within week
    const byCategory = {};
    for (const t of weekTasks) {
      const cat = t.category || 'other';
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(t);
    }
    
    for (const [cat, catTasks] of Object.entries(byCategory)) {
      const catDone = catTasks.filter(t => t.status === 'done').length;
      html += `<div class="day-card">
        <div class="day-header">
          <span class="day-name">📁 ${cat}</span>
          <span class="day-count">${catDone}/${catTasks.length}</span>
        </div>
        <ul class="task-list">`;
      
      for (const t of catTasks) {
        const cls = statusClass[t.status] || 'status-todo';
        const descCls = t.status === 'done' ? 'done' : '';
        html += `<li class="task-item">
          <span class="task-status ${cls}" title="${t.status}"></span>
          <span class="task-desc ${descCls}">${escapeHtml(t.title)}</span>
        </li>`;
      }
      
      html += `</ul></div>`;
    }
    
    html += `</div></div>`;
  }
  
  grid.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Render runs
function renderRuns(runs) {
  const tbody = document.getElementById('runsBody');
  if (!runs || runs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text3)">No runs yet</td></tr>';
    return;
  }
  
  tbody.innerHTML = runs.map(r => {
    const statusEmoji = r.status === 'success' ? '✅' : r.status === 'failed' ? '❌' : '🔄';
    const cost = r.cost_eur ? `€${r.cost_eur.toFixed(6)}` : '—';
    const started = r.started_at ? new Date(r.started_at).toLocaleString() : '—';
    return `<tr>
      <td title="${escapeHtml(r.task_title || '')}">${escapeHtml((r.task_title || '?').substring(0, 60))}</td>
      <td>${escapeHtml(r.model || '—')}</td>
      <td>${statusEmoji} ${r.status}</td>
      <td>${(r.tokens_in || 0).toLocaleString()}</td>
      <td>${(r.tokens_out || 0).toLocaleString()}</td>
      <td>${cost}</td>
      <td>${started}</td>
    </tr>`;
  }).join('');
}

// Update stats
function updateStats(summary, stats) {
  document.getElementById('statTotal').textContent = summary.total;
  document.getElementById('statPending').textContent = summary.pending;
  document.getElementById('statActive').textContent = summary.active;
  document.getElementById('statDone').textContent = summary.done;
  document.getElementById('statRuns').textContent = stats.total_runs;
  document.getElementById('statCost').textContent = `€${(stats.total_cost || 0).toFixed(4)}`;
  document.getElementById('updateTime').textContent = `Updated: ${new Date().toLocaleTimeString()}`;
}

// Load all data
async function loadAll() {
  if (!await checkAuth()) return;
  
  try {
    const [summaryRes, statsRes, tasksRes, runsRes] = await Promise.all([
      fetch('/api/tasks/summary'),
      fetch('/api/tasks/stats'),
      fetch('/api/tasks'),
      fetch('/api/tasks/runs')
    ]);
    
    const summary = await summaryRes.json();
    const stats = await statsRes.json();
    const tasks = await tasksRes.json();
    const runs = await runsRes.json();
    
    updateStats(summary, stats);
    renderTasks(tasks);
    renderRuns(runs);
  } catch (e) {
    document.getElementById('taskGrid').innerHTML = `<div class="error">Failed to load tasks: ${e.message}</div>`;
  }
}

// Auto-refresh every 60s
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
