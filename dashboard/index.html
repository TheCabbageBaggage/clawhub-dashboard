<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClawHub Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-container{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:40px;width:100%;max-width:400px;text-align:center}
h1{color:#f0f6fc;font-size:1.5rem;margin-bottom:8px}
.subtitle{color:#8b949e;font-size:.9rem;margin-bottom:24px}
.form-group{margin-bottom:20px;text-align:left}
label{display:block;margin-bottom:6px;font-size:.85rem;color:#8b949e;text-transform:uppercase;letter-spacing:.05em}
input[type="password"]{width:100%;padding:10px 14px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:1rem;outline:none;transition:border-color .2s}
input[type="password"]:focus{border-color:#58a6ff}
.login-btn{width:100%;padding:10px;background:#238636;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
.login-btn:hover{background:#2ea043}
.error{color:#f85149;font-size:.85rem;margin-bottom:12px;display:none}
.loading{display:none;color:#8b949e;font-size:.85rem;margin-bottom:12px}
</style>
</head>
<body>
<div class="login-container">
    <h1>ClawHub Dashboard</h1>
    <p class="subtitle">Enter password to access the dashboard</p>
    <div class="error" id="error-msg">Incorrect password. Please try again.</div>
    <div class="loading" id="loading-msg">Authenticating...</div>
    <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required autofocus>
        </div>
        <button type="submit" class="login-btn">Login</button>
    </form>
</div>

<script>
async function handleLogin(event) {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error-msg');
    const loadingEl = document.getElementById('loading-msg');
    
    errorEl.style.display = 'none';
    loadingEl.style.display = 'block';
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        
        const data = await response.json();
        
        if (data.success) {
            sessionStorage.setItem('ops_auth', 'true');
            sessionStorage.setItem('ops_auth_time', Date.now().toString());
            sessionStorage.setItem('ops_token', data.token);
            window.location.href = '/dashboard.html';
        } else {
            errorEl.textContent = 'Incorrect password. Please try again.';
            errorEl.style.display = 'block';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    } catch (e) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.style.display = 'block';
    }
    
    loadingEl.style.display = 'none';
    return false;
}
</script>
</body>
</html>
