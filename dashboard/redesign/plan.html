<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawHub — Projekte</title>
  <link rel="stylesheet" href="css/acta-theme.css">
</head>
<body>
  <div class="acta-layout">
    <main class="acta-main">
      <div class="acta-content" id="content">
        <div class="acta-loading"><span class="acta-spinner"></span>Lade Projekte…</div>
      </div>
    </main>
  </div>

  <script src="js/acta-shell.js" data-shell=""></script>
  <script>
    let TASKS = [], EPICS = [], STORIES = [], LABELS = [], RUNS = [], SUMMARY = {}, STATS = {};
    let activeEpic = 'all', activeStory = 'all', activeLabel = 'all', activeCat = 'all', searchTerm = '';

    function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmt(n, d=0) { if (n === null || n === undefined || isNaN(n)) return '—'; return Number(n).toLocaleString('de-DE', { maximumFractionDigits: d }); }
    function formatK(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    }

    const COLUMNS = [
      { key: 'backlog', title: 'Backlog' },
      { key: 'todo', title: 'To Do' },
      { key: 'in_progress', title: 'In Progress' },
      { key: 'done', title: 'Done' },
      { key: 'blocked', title: 'Blocked' }
    ];

    function taskColumn(t) {
      if (t.status === 'in_progress') return 'in_progress';
      if (t.status === 'done') return 'done';
      if (t.status === 'blocked') return 'blocked';
      if (t.status === 'pending' || !t.status) {
        const today = new Date().toISOString().slice(0,10);
        return (t.planned_date && t.planned_date <= today) ? 'todo' : 'backlog';
      }
      return 'backlog';
    }

    function statusBadge(s) {
      const map = { pending:'neutral', in_progress:'warning', done:'success', blocked:'alert' };
      const cls = map[s] || 'neutral';
      return '<span class="acta-badge acta-badge-' + cls + '">' + esc(s || '—') + '</span>';
    }

    function renderTaskCard(task) {
      const taskCost = Number(task.cost_eur || 0);
      const taskTok = Number(task.tokens_in || 0) + Number(task.tokens_out || 0);
      const usageBadge = taskCost > 0 || taskTok > 0
        ? '<span class="acta-badge" style="background:var(--acta-teal-soft);color:var(--acta-teal);font-size:0.65rem;">€' + taskCost.toFixed(4) + ' · ' + formatK(taskTok) + ' tok</span>'
        : '';
      const epicBadge = task.epic_title
        ? '<span class="acta-badge" style="background:' + (task.epic_color || '#3D8B8B') + ';color:#fff;font-size:0.65rem;">' + esc(task.epic_title) + '</span>'
        : '';
      const labelBadges = (task.labels || []).slice(0, 2).map(l =>
        '<span class="acta-badge" style="background:' + (l.color || '#8A9BA8') + ';color:#fff;font-size:0.65rem;">' + esc(l.name) + '</span>'
      ).join('');

      return '<div style="padding:0.6rem;border:1px solid var(--acta-border);border-radius:0.5rem;background-color:var(--acta-light-gray);">' +
        '<div style="font-size:0.8rem;font-weight:500;line-height:1.3;">' + esc(task.title) + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:0.25rem;margin-top:0.4rem;">' +
          epicBadge + labelBadges + usageBadge +
        '</div>' +
      '</div>';
    }

    function renderEpicTree() {
      let html = '';

      const unassignedStories = STORIES.filter(s => !s.epic_id);
      if (unassignedStories.length > 0) {
        html += '<div style="margin-bottom:0.75rem;">';
        html += '<div style="font-size:0.75rem;font-weight:600;color:var(--acta-petroleum);cursor:pointer;padding:0.3rem 0;" data-epic-id="all">📂 Unassigned</div>';
        unassignedStories.forEach(s => {
          html += '<div style="font-size:0.7rem;color:var(--acta-slate);padding:0.15rem 0 0.15rem 1rem;cursor:pointer;" data-story-id="' + s.id + '">' + esc(s.title) + '</div>';
        });
        html += '</div>';
      }

      EPICS.forEach(epic => {
        const stories = STORIES.filter(s => s.epic_id === epic.id);
        const cost = epic.total_cost_eur ? '€' + Number(epic.total_cost_eur).toFixed(4) : '';
        const tok = (epic.total_tokens_in || epic.total_tokens_out) ? formatK(Number(epic.total_tokens_in || 0) + Number(epic.total_tokens_out || 0)) + ' tok' : '';
        const runs = epic.total_runs ? epic.total_runs + ' runs' : '';
        const avgCost = epic.avg_cost_per_run ? 'Ø€' + Number(epic.avg_cost_per_run).toFixed(4) : '';
        const usageParts = [cost, runs, tok, avgCost].filter(Boolean);
        const usageTag = usageParts.length ? '<div style="font-size:0.65rem;color:var(--acta-slate);margin-top:0.15rem;">' + usageParts.join(' · ') + '</div>' : '';

        html += '<div style="margin-bottom:0.75rem;">';
        html += '<div style="font-size:0.75rem;font-weight:600;cursor:pointer;padding:0.3rem 0;" data-epic-id="' + epic.id + '">';
        html += '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + esc(epic.color || '#3D8B8B') + ';margin-right:4px;vertical-align:middle;"></span>';
        html += esc(epic.title) + ' <span style="color:var(--acta-slate);font-weight:400;">(' + stories.length + ')</span>';
        html += '</div>';
        html += usageTag;
        stories.forEach(s => {
          html += '<div style="font-size:0.7rem;color:var(--acta-slate);padding:0.15rem 0 0.15rem 1rem;cursor:pointer;" data-story-id="' + s.id + '">' + esc(s.title) + '</div>';
        });
        html += '</div>';
      });

      if (!html) html = '<div style="color:var(--acta-slate);font-size:0.75rem;">Noch keine Epics</div>';
      return html;
    }

    function render() {
      const content = document.getElementById('content');
      const cats = [...new Set(TASKS.map(t => t.category).filter(Boolean))].sort();

      let filtered = TASKS;
      if (activeEpic !== 'all') filtered = filtered.filter(t => String(t.epic_id) === activeEpic);
      if (activeStory !== 'all') filtered = filtered.filter(t => String(t.story_id) === activeStory);
      if (activeLabel !== 'all') filtered = filtered.filter(t => (t.labels || []).some(l => String(l.id) === activeLabel));
      if (activeCat !== 'all') filtered = filtered.filter(t => t.category === activeCat);
      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        filtered = filtered.filter(t => (t.title + ' ' + (t.epic_title||'') + ' ' + (t.story_title||'')).toLowerCase().includes(q));
      }

      // Usage aggregation
      const estTotalCost = TASKS.reduce((sum, t) => sum + (Number(t.cost_eur) || 0), 0);
      const estTotalTokens = TASKS.reduce((sum, t) => sum + (Number(t.tokens_in) || 0) + (Number(t.tokens_out) || 0), 0);
      const colCounts = { backlog: 0, todo: 0, in_progress: 0, done: 0, blocked: 0 };
      filtered.forEach(t => { colCounts[taskColumn(t)]++; });

      content.innerHTML = `
        <div class="acta-grid acta-grid-4" style="margin-bottom:1.25rem;">
          <div class="acta-card acta-metric"><div class="acta-metric-label">Total</div><div class="acta-metric-value">${TASKS.length}</div><div class="acta-metric-sub">Tasks</div></div>
          <div class="acta-card acta-metric"><div class="acta-metric-label">In Progress</div><div class="acta-metric-value" style="color:var(--acta-warning);">${colCounts.in_progress}</div><div class="acta-metric-sub">aktiv</div></div>
          <div class="acta-card acta-metric"><div class="acta-metric-label">Done</div><div class="acta-metric-value" style="color:var(--acta-success);">${colCounts.done}</div><div class="acta-metric-sub">erledigt</div></div>
          <div class="acta-card acta-metric"><div class="acta-metric-label">Runs</div><div class="acta-metric-value">${STATS.total_runs ?? RUNS.length}</div><div class="acta-metric-sub">€ ${fmt(STATS.total_cost, 4)}</div></div>
        </div>

        <div class="acta-grid acta-grid-3" style="margin-bottom:1.25rem;">
          <div class="acta-card acta-metric"><div class="acta-metric-label">Est. Total</div><div class="acta-metric-value" style="color:var(--acta-teal);">€${estTotalCost.toFixed(4)}</div><div class="acta-metric-sub">${formatK(estTotalTokens)} tokens</div></div>
          <div class="acta-card acta-metric"><div class="acta-metric-label">Est. Avg/Run</div><div class="acta-metric-value" style="color:var(--acta-teal);">€${STATS.total_runs > 0 ? (estTotalCost / STATS.total_runs).toFixed(4) : '0.0000'}</div><div class="acta-metric-sub">pro Run</div></div>
          <div class="acta-card acta-metric"><div class="acta-metric-label">Blocked</div><div class="acta-metric-value" style="color:var(--acta-alert);">${colCounts.blocked}</div><div class="acta-metric-sub">Tasks</div></div>
        </div>

        <div class="acta-toolbar">
          <div class="acta-search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Task suchen…" value="${esc(searchTerm)}">
          </div>
          <select class="acta-select" id="epicSelect">
            <option value="all" ${activeEpic==='all'?'selected':''}>Alle Epics</option>
            ${EPICS.map(e => `<option value="${e.id}" ${activeEpic===String(e.id)?'selected':''}>${esc(e.title)}</option>`).join('')}
          </select>
          <select class="acta-select" id="catSelect">
            <option value="all" ${activeCat==='all'?'selected':''}>Alle Kategorien</option>
            ${cats.map(c => `<option value="${c}" ${activeCat===c?'selected':''}>${esc(c)}</option>`).join('')}
          </select>
        </div>

        <div class="acta-plan-layout" style="display:flex;gap:1rem;margin-bottom:1.25rem;">
          <div class="acta-card" style="flex:0 0 260px;max-height:70vh;overflow-y:auto;">
            <div class="acta-card-title">Epics &amp; Stories</div>
            <div id="epicTree">${renderEpicTree()}</div>
          </div>

          <div style="flex:1;min-width:0;overflow-x:auto;">
            <div class="acta-kanban acta-grid" style="grid-template-columns:repeat(5,1fr);gap:0.75rem;">
              ${COLUMNS.map(col => {
                const colTasks = filtered.filter(t => taskColumn(t) === col.key);
                return `
                  <div class="acta-card" style="min-height:200px;">
                    <div class="acta-card-title" style="display:flex;justify-content:space-between;align-items:center;">
                      ${col.title} <span class="acta-badge acta-badge-neutral">${colTasks.length}</span>
                    </div>
                    <div class="acta-kanban-inner" style="display:flex;flex-direction:column;gap:0.5rem;margin-top:0.5rem;">
                      ${colTasks.map(t => renderTaskCard(t)).join('') || '<div class="acta-empty" style="padding:1rem;font-size:0.75rem;">Leer</div>'}
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>
        </div>

        <div class="acta-card">
          <div class="acta-card-title">Recent Runs <span class="acta-badge acta-badge-neutral">${RUNS.length}</span></div>
          <div class="acta-table-wrap">
            <table class="acta-table">
              <thead><tr><th>Task</th><th>Modell</th><th>Status</th><th>Tokens In</th><th>Tokens Out</th><th>Kosten</th></tr></thead>
              <tbody>
                ${RUNS.map(r => `
                  <tr>
                    <td>${esc(r.task_title || '—')}</td>
                    <td>${esc(r.model || '—')}</td>
                    <td>${statusBadge(r.status)}</td>
                    <td>${fmt(r.tokens_in)}</td>
                    <td>${fmt(r.tokens_out)}</td>
                    <td>€ ${fmt(r.cost_eur, 6)}</td>
                  </tr>`).join('') || '<tr><td colspan="6" class="acta-empty">Keine Runs</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; render(); });
      document.getElementById('epicSelect').addEventListener('change', e => { activeEpic = e.target.value; render(); });
      document.getElementById('catSelect').addEventListener('change', e => { activeCat = e.target.value; render(); });

      // Epic tree click handlers
      document.querySelectorAll('[data-epic-id]').forEach(el => {
        el.addEventListener('click', () => { activeEpic = el.dataset.epicId; render(); });
      });
      document.querySelectorAll('[data-story-id]').forEach(el => {
        el.addEventListener('click', () => { activeStory = el.dataset.storyId; render(); });
      });
    }

    async function load() {
      try {
        const [tasksRes, epicsRes, storiesRes, labelsRes, runsRes, sumRes, statsRes] = await Promise.all([
          fetch('/api/tasks'), fetch('/api/epics'), fetch('/api/stories'), fetch('/api/labels'),
          fetch('/api/tasks/runs'), fetch('/api/tasks/summary'), fetch('/api/tasks/stats')
        ]);
        if (tasksRes.status === 401) { window.location.href = '/login'; return; }
        TASKS = await tasksRes.json();
        EPICS = await epicsRes.json();
        STORIES = await storiesRes.json();
        LABELS = await labelsRes.json();
        RUNS = await runsRes.json();
        SUMMARY = await sumRes.json();
        STATS = await statsRes.json();
        render();
      } catch (e) {
        document.getElementById('content').innerHTML = '<div class="acta-empty">Fehler beim Laden: ' + e.message + '</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
