<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawHub — Recherchen</title>
  <link rel="stylesheet" href="css/acta-theme.css">
</head>
<body>
  <div class="acta-layout">
    <main class="acta-main">
      <div class="acta-content" id="content">
        <div class="acta-loading"><span class="acta-spinner"></span>Lade Recherchen…</div>
      </div>
    </main>
  </div>

  <div class="acta-modal" id="docModal" style="display:none;">
    <div class="acta-modal-backdrop" onclick="closeModal()"></div>
    <div class="acta-modal-content">
      <div class="acta-modal-header">
        <div class="acta-modal-title" id="modalTitle"></div>
        <button class="acta-modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="acta-modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/acta-shell.js" data-shell=""></script>
  <script>
    let DOCS = [];
    let activeCat = 'all';
    let activeType = 'all';
    let searchTerm = '';
    let sortKey = 'date';
    let sortDir = -1;

    const TYPE_COLORS = { 'MD':'#387359', 'HTML':'#CC9A33', 'PDF':'#BF3939' };

    function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function renderMarkdown(md) {
      if (!md) return '';
      let html = esc(md);
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
      html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
      html = html.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      html = html.replace(/^---$/gm, '<hr>');
      html = html.replace(/^- (.*)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/g, '<ul>$1</ul>');
      html = html.replace(/^(?!<[hupb]|<\/|$)(.*)$/gm, '<p>$1</p>');
      return html;
    }

    function closeModal() { document.getElementById('docModal').style.display = 'none'; }

    async function openDoc(doc) {
      document.getElementById('modalTitle').textContent = doc.title;
      const body = document.getElementById('modalBody');
      body.innerHTML = '<div class="acta-loading"><span class="acta-spinner"></span>Lade Dokument…</div>';
      document.getElementById('docModal').style.display = 'flex';
      try {
        const res = await fetch('/api/research/' + encodeURIComponent(doc.path));
        if (!res.ok) { body.innerHTML = '<div class="acta-empty">Fehler beim Laden (' + res.status + ')</div>'; return; }
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/pdf')) {
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          body.innerHTML = '<div style="margin-bottom:0.75rem;"><a class="acta-btn acta-btn-primary" href="' + url + '" download>PDF herunterladen</a></div><iframe src="' + url + '" style="width:100%;height:60vh;border:none;border-radius:0.5rem;"></iframe>';
        } else if (ct.includes('text/html')) {
          const text = await res.text();
          const m = text.match(/<body[^>]*>([\s\S]*)<\/body>/i);
          body.innerHTML = m ? m[1] : text;
        } else {
          const text = await res.text();
          body.innerHTML = renderMarkdown(text);
        }
      } catch (e) {
        body.innerHTML = '<div class="acta-empty">Fehler: ' + e.message + '</div>';
      }
    }

    function sortBy(key) {
      if (sortKey === key) { sortDir = -sortDir; } else { sortKey = key; sortDir = 1; }
      render();
    }
    function sortIcon(key) {
      if (sortKey !== key) return '↕';
      return sortDir === 1 ? '↑' : '↓';
    }

    function render() {
      const content = document.getElementById('content');
      const cats = [...new Set(DOCS.map(d => d.category))].sort();
      const md = DOCS.filter(d => d.type === 'MD').length;
      const html = DOCS.filter(d => d.type === 'HTML').length;
      const pdf = DOCS.filter(d => d.type === 'PDF').length;

      let filtered = DOCS;
      if (activeCat !== 'all') filtered = filtered.filter(d => d.category === activeCat);
      if (activeType !== 'all') filtered = filtered.filter(d => d.type === activeType);
      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        filtered = filtered.filter(d => (d.title + ' ' + (d.summary||'') + ' ' + (d.category||'')).toLowerCase().includes(q));
      }
      filtered = filtered.slice().sort((a, b) => {
        const av = (a[sortKey] || '').toString().toLowerCase();
        const bv = (b[sortKey] || '').toString().toLowerCase();
        return av < bv ? -sortDir : av > bv ? sortDir : 0;
      });

      content.innerHTML = `
        <div class="acta-grid acta-grid-4" style="margin-bottom:1.25rem;">
          <div class="acta-card acta-metric"><div class="acta-metric-label">Dokumente</div><div class="acta-metric-value">${DOCS.length}</div><div class="acta-metric-sub">im Archiv</div></div>
          <div class="acta-card acta-metric"><div class="acta-metric-label">Kategorien</div><div class="acta-metric-value">${cats.length}</div><div class="acta-metric-sub">Themen</div></div>
          <div class="acta-card acta-metric"><div class="acta-metric-label">Markdown</div><div class="acta-metric-value" style="color:var(--acta-success);">${md}</div><div class="acta-metric-sub">${html} HTML · ${pdf} PDF</div></div>
          <div class="acta-card acta-metric"><div class="acta-metric-label">Treffer</div><div class="acta-metric-value">${filtered.length}</div><div class="acta-metric-sub">gefiltert</div></div>
        </div>

        <div class="acta-toolbar">
          <div class="acta-search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Recherche suchen…" value="${esc(searchTerm)}">
          </div>
          <select class="acta-select" id="catSelect">
            <option value="all" ${activeCat==='all'?'selected':''}>Alle Kategorien</option>
            ${cats.map(c => `<option value="${c}" ${activeCat===c?'selected':''}>${c}</option>`).join('')}
          </select>
          <select class="acta-select" id="typeSelect">
            <option value="all" ${activeType==='all'?'selected':''}>Alle Typen</option>
            <option value="MD" ${activeType==='MD'?'selected':''}>Markdown</option>
            <option value="HTML" ${activeType==='HTML'?'selected':''}>HTML</option>
            <option value="PDF" ${activeType==='PDF'?'selected':''}>PDF</option>
          </select>
        </div>

        <div class="acta-card">
          <div class="acta-card-title">Recherchen <span class="acta-badge acta-badge-neutral">${filtered.length}</span></div>
          <div class="acta-table-wrap">
            <table class="acta-table">
              <thead>
                <tr>
                  <th style="cursor:pointer;" onclick="sortBy('title')">Titel ${sortIcon('title')}</th>
                  <th style="cursor:pointer;" onclick="sortBy('category')">Kategorie ${sortIcon('category')}</th>
                  <th style="cursor:pointer;" onclick="sortBy('type')">Typ ${sortIcon('type')}</th>
                  <th style="cursor:pointer;" onclick="sortBy('date')">Datum ${sortIcon('date')}</th>
                  <th>Zusammenfassung</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${filtered.map(d => `
                  <tr>
                    <td style="font-weight:500;color:var(--acta-petroleum);cursor:pointer;" onclick="openDoc(${JSON.stringify(d).replace(/"/g,'&quot;')})">${esc(d.title)}</td>
                    <td><span class="acta-badge" style="background:var(--acta-petroleum);color:#fff;">${esc(d.category || '—')}</span></td>
                    <td><span class="acta-badge" style="background:${TYPE_COLORS[d.type] || '#8A9BA8'};color:#fff;">${esc(d.type || '—')}</span></td>
                    <td style="font-size:0.8rem;color:var(--acta-slate);white-space:nowrap;">${esc(d.date || '—')}</td>
                    <td style="font-size:0.8rem;color:var(--acta-slate);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.summary || '')}</td>
                    <td><button class="acta-btn acta-btn-sm" onclick="openDoc(${JSON.stringify(d).replace(/"/g,'&quot;')})">Öffnen</button></td>
                  </tr>`).join('') || '<tr><td colspan="6" class="acta-empty">Keine Recherchen gefunden</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; render(); });
      document.getElementById('catSelect').addEventListener('change', e => { activeCat = e.target.value; render(); });
      document.getElementById('typeSelect').addEventListener('change', e => { activeType = e.target.value; render(); });
    }

    async function load() {
      try {
        const res = await fetch('/api/research');
        if (res.status === 401) { window.location.href = '/login'; return; }
        DOCS = await res.json();
        render();
      } catch (e) {
        document.getElementById('content').innerHTML = '<div class="acta-empty">Fehler beim Laden: ' + e.message + '</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
