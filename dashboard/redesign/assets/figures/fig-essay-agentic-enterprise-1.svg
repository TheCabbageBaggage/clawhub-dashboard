<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif"><title>Fünf Schichten einer verantworteten Entscheidungsschleife</title><rect width="880" height="560" fill="#F5F6F7"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A9BA8"/></marker></defs><text x="30" y="38" font-size="16" fill="#1A3440" font-weight="bold" text-anchor="start">Fünf Schichten einer verantworteten Entscheidungsschleife</text><rect x="60" y="70" width="760" height="66" rx="6" fill="#1A3440" stroke="#1A3440" stroke-width="1.2"/><text x="440.0" y="101.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1 · Menschliche Ergebnisverantwortung</text><text x="440.0" y="118.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">Business Owner, Eingriffsrecht, Eskalation</text><line x1="440" y1="136" x2="440" y2="162" stroke="#8A9BA8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="162" width="760" height="66" rx="6" fill="#CC9A33" stroke="#CC9A33" stroke-width="1.2"/><text x="440.0" y="193.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2 · Agent mit begrenzter Kompetenz</text><text x="440.0" y="210.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">Informieren · empfehlen · vorbereiten</text><line x1="440" y1="228" x2="440" y2="254" stroke="#8A9BA8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="254" width="760" height="66" rx="6" fill="#2C5F7C" stroke="#2C5F7C" stroke-width="1.2"/><text x="440.0" y="285.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3 · Überprüfbarer Kontext</text><text x="440.0" y="302.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">Historie, Provenienz, Anlagenidentität</text><line x1="440" y1="320" x2="440" y2="346" stroke="#8A9BA8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="346" width="760" height="66" rx="6" fill="#3D8B8B" stroke="#3D8B8B" stroke-width="1.2"/><text x="440.0" y="377.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">4 · Betriebliche Systeme</text><text x="440.0" y="394.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">ERP · MES · CMMS · PLM · OT</text><line x1="440" y1="412" x2="440" y2="438" stroke="#8A9BA8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="438" width="760" height="66" rx="6" fill="#387359" stroke="#387359" stroke-width="1.2"/><text x="440.0" y="469.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">5 · Ergebnis und Feedback</text><text x="440.0" y="486.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">beobachtetes Ergebnis → Lernschleife</text><path d="M820 471 C 868 471, 868 103, 820 103" fill="none" stroke="#3D8B8B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="700" y="300" font-size="10" fill="#3D8B8B" font-weight="bold" text-anchor="start">Feedback: Ergebnis → Verantwortung</text></svg>