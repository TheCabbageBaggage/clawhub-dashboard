<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif"><title>Industrielles Gedächtnis als überprüfbarer Lernkreis</title><rect width="880" height="500" fill="#F5F6F7"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A9BA8"/></marker></defs><text x="30" y="38" font-size="16" fill="#1A3440" font-weight="bold" text-anchor="start">Industrielles Gedächtnis als überprüfbarer Lernkreis</text><rect x="60" y="70" width="760" height="64" rx="6" fill="#8A9BA8" stroke="#8A9BA8" stroke-width="1.2"/><text x="440.0" y="100.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1 · Betriebliche Quellen</text><text x="440.0" y="117.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">Handbücher · Ereignisse · Erfahrungsberichte</text><line x1="440" y1="134" x2="440" y2="160" stroke="#8A9BA8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="160" width="760" height="64" rx="6" fill="#2C5F7C" stroke="#2C5F7C" stroke-width="1.2"/><text x="440.0" y="190.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2 · Kontext und Identität</text><text x="440.0" y="207.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">Anlage · Version · Zeitpunkt · Provenienz</text><line x1="440" y1="224" x2="440" y2="250" stroke="#8A9BA8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="250" width="760" height="64" rx="6" fill="#3D8B8B" stroke="#3D8B8B" stroke-width="1.2"/><text x="440.0" y="280.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3 · Evidenz</text><text x="440.0" y="297.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">relevante Fundstellen, fachlich geprüft</text><line x1="440" y1="314" x2="440" y2="340" stroke="#8A9BA8" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="340" width="760" height="64" rx="6" fill="#1A3440" stroke="#1A3440" stroke-width="1.2"/><text x="440.0" y="370.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">4 · Entscheidung</text><text x="440.0" y="387.0" font-size="10" fill="#ffffff" font-weight="normal" text-anchor="middle">begründet, nachvollziehbar, verantwortet</text><path d="M820 372 C 866 372, 866 282, 820 282" fill="none" stroke="#3D8B8B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="690" y="290" font-size="10" fill="#3D8B8B" font-weight="bold" text-anchor="start">Feedback aktualisiert Evidenz, nicht Häufigkeit</text></svg>