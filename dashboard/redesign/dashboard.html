<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawHub — System</title>
  <link rel="stylesheet" href="css/acta-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="acta-layout">
    <main class="acta-main">
      <div class="acta-content" id="content">
        <div class="acta-loading"><span class="acta-spinner"></span>Lade System-Metriken…</div>
      </div>
    </main>
  </div>

  <script src="js/acta-shell.js" data-shell=""></script>
  <script>
    const ACTA = { petroleum:'#2C5F7C', navy:'#1A3440', teal:'#3D8B8B', slate:'#8A9BA8',
                   success:'#387359', warning:'#CC9A33', alert:'#BF3939' };
    const PALETTE = [ACTA.petroleum, ACTA.teal, ACTA.slate, ACTA.navy, ACTA.warning, ACTA.success, ACTA.alert];
    let charts = {};

    function destroyCharts() {
      Object.values(charts).forEach(c => { if (c) c.destroy(); });
      charts = {};
    }

    function fmt(n, d=0) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return Number(n).toLocaleString('de-DE', { maximumFractionDigits: d });
    }

    function fmtBig(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      const v = Number(n);
      if (v >= 1e9) return (v/1e9).toFixed(2) + ' Mrd';
      if (v >= 1e6) return (v/1e6).toFixed(1) + ' Mio';
      if (v >= 1e3) return (v/1e3).toFixed(1) + ' K';
      return String(v);
    }

    function fmtBytes(mb) {
      if (mb === null || mb === undefined) return '—';
      if (mb >= 1024) return (mb/1024).toFixed(1) + ' GB';
      return Math.round(mb) + ' MB';
    }

    function fmtUptime(sec) {
      if (!sec) return '—';
      const d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600), m = Math.floor((sec%3600)/60);
      return d + 'd ' + h + 'h ' + m + 'm';
    }

    function badge(state) {
      const s = (state || '').toLowerCase();
      if (['green','running','ok','healthy','up'].includes(s)) return '<span class="acta-badge acta-badge-success">' + state + '</span>';
      if (['yellow','warning','paused','restarting'].includes(s)) return '<span class="acta-badge acta-badge-warning">' + state + '</span>';
      if (['red','stopped','error','exited','dead'].includes(s)) return '<span class="acta-badge acta-badge-alert">' + state + '</span>';
      return '<span class="acta-badge acta-badge-neutral">' + (state || '—') + '</span>';
    }

    function laneBadge(lane) {
      const map = { cron:'neutral', main:'success', subagent:'warning',
                    'admin-agent':'success', hanna:'success', codex:'warning' };
      return '<span class="acta-badge acta-badge-' + (map[lane] || 'neutral') + '">' + (lane || '—') + '</span>';
    }

    async function load() {
      const content = document.getElementById('content');
      try {
        const [resM, resT] = await Promise.all([
          fetch('/api/metrics'),
          fetch('/api/task-usage').catch(() => null)
        ]);
        if (resM.status === 401) { window.location.href = '/login'; return; }
        const data = await resM.json();
        let taskData = { tasks: [], scrum: [] };
        if (resT && resT.ok) { try { taskData = await resT.json(); } catch (e) {} }

        const m = data.metrics || {};
        const ollama = m['ollama-usage'] || {};
        const sys = m.system || {};
        const containers = Array.isArray(m.containers) ? m.containers : [];
        const sec = m.security || {};
        const storage = m.storage || {};
        const history = Array.isArray(ollama.history) ? ollama.history : [];

        const running = containers.filter(c => (c.state||'').toLowerCase() === 'running').length;
        const stopped = containers.length - running;
        const memPct = sys.memory ? sys.memory.pct : null;
        const diskPct = sys.disk ? sys.disk.pct : null;
        const storagePct = storage.total_gb ? Math.round(storage.used_gb / storage.total_gb * 100) : null;
        const tasks = taskData.tasks || [];

        content.innerHTML = `
          <!-- KPI-Karten -->
          <div class="acta-grid acta-grid-4" style="margin-bottom:1.25rem;">
            <div class="acta-card acta-metric">
              <div class="acta-metric-label">Ollama Weekly</div>
              <div class="acta-metric-value">${fmt(ollama.weekly && ollama.weekly.usage_pct, 1)}%</div>
              <div class="acta-metric-sub">${fmt(ollama.weekly && ollama.weekly.requests)} Requests</div>
            </div>
            <div class="acta-card acta-metric">
              <div class="acta-metric-label">Ollama Session</div>
              <div class="acta-metric-value">${fmt(ollama.session && ollama.session.usage_pct, 1)}%</div>
              <div class="acta-metric-sub">${fmt(ollama.session && ollama.session.requests)} Requests</div>
            </div>
            <div class="acta-card acta-metric">
              <div class="acta-metric-label">Container</div>
              <div class="acta-metric-value">${running}<span style="font-size:0.9rem;color:var(--acta-slate);"> / ${containers.length}</span></div>
              <div class="acta-metric-sub">${stopped} gestoppt</div>
            </div>
            <div class="acta-card acta-metric">
              <div class="acta-metric-label">Kosten 4 Wochen</div>
              <div class="acta-metric-value" style="color:var(--acta-success);">$${fmt(ollama.cost_4weeks, 2)}</div>
              <div class="acta-metric-sub">Uptime ${fmtUptime(sys.uptime_seconds)}</div>
            </div>
          </div>

          <!-- 14-Tage-Verlauf -->
          <div class="acta-card" style="margin-bottom:1.25rem;">
            <div class="acta-card-title">Ollama Usage — Verlauf (14 Tage)</div>
            <div class="acta-chart-box acta-chart-box-lg"><canvas id="trendChart"></canvas></div>
            <div class="acta-metric-sub" style="margin-top:0.5rem;">
              Linie = Weekly-Usage-%-Wert pro Tag (Tagesendstand) · Balken = Requests pro Tag
            </div>
          </div>

          <!-- Modell-Verteilung + Container-Doughnut -->
          <div class="acta-grid acta-grid-2" style="margin-bottom:1.25rem;">
            <div class="acta-card">
              <div class="acta-card-title">Ollama Modell-Verteilung</div>
              <div class="acta-chart-box"><canvas id="modelChart"></canvas></div>
            </div>
            <div class="acta-card">
              <div class="acta-card-title">Container-Status</div>
              <div class="acta-chart-box"><canvas id="containerChart"></canvas></div>
            </div>
          </div>

          <!-- Task-Tabelle -->
          <div class="acta-card" style="margin-bottom:1.25rem;">
            <div class="acta-card-title">Tasks — Usage &amp; Modell <span class="acta-badge acta-badge-neutral">${tasks.length}</span></div>
            <div class="acta-metric-sub" style="margin-bottom:0.75rem;">Quellen: Cron-Jobs · Chat-Lanes · Scrum-Board · Zeitfenster: letzte ${taskData.days || 14} Tage</div>
            <div class="acta-table-wrap">
              <table class="acta-table">
                <thead><tr><th>Task</th><th>Quelle</th><th>Agent-Lane</th><th style="text-align:right;">Requests</th><th style="text-align:right;">Tokens In</th><th style="text-align:right;">Tokens Out</th><th>Modell(e)</th></tr></thead>
                <tbody>
                  ${tasks.map(t => `
                    <tr>
                      <td>${t.task_name}</td>
                      <td>${laneBadge(t.lane)}</td>
                      <td>${t.lane || '—'}</td>
                      <td style="text-align:right;">${fmt(t.requests)}</td>
                      <td style="text-align:right;">${fmtBig(t.tokens_in)}</td>
                      <td style="text-align:right;">${fmtBig(t.tokens_out)}</td>
                      <td>${(t.models || []).map(x => `${x.name} <span style="color:var(--acta-slate);">(${x.requests})</span>`).join('<br>') || '—'}</td>
                    </tr>`).join('') || '<tr><td colspan="7" class="acta-empty">Keine Task-Daten</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Scrum-Board -->
          ${(taskData.scrum || []).length ? `
          <div class="acta-card" style="margin-bottom:1.25rem;">
            <div class="acta-card-title">Scrum-Board (geplante Tasks)</div>
            <div class="acta-table-wrap">
              <table class="acta-table">
                <thead><tr><th>Task</th><th>Status</th><th>Priorität</th><th>Geplant</th></tr></thead>
                <tbody>
                  ${taskData.scrum.map(s => `<tr><td>${s.title}</td><td>${badge(s.status)}</td><td>${s.priority || '—'}</td><td>${s.planned_date || '—'}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>` : ''}

          <!-- Container-Übersicht -->
          <div class="acta-card" style="margin-bottom:1.25rem;">
            <div class="acta-card-title">Container-Status <span class="acta-badge acta-badge-neutral">${running} running / ${containers.length}</span></div>
            <div class="acta-table-wrap">
              <table class="acta-table">
                <thead><tr><th>Container</th><th>State</th><th>Status</th></tr></thead>
                <tbody>
                  ${containers.map(c => `
                    <tr>
                      <td>${c.name}</td>
                      <td>${badge(c.state)}</td>
                      <td style="color:var(--acta-slate);">${c.status || '—'}</td>
                    </tr>`).join('') || '<tr><td colspan="3" class="acta-empty">Keine Container-Daten</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <!-- System-Balken -->
          <div class="acta-grid acta-grid-3" style="margin-bottom:1.25rem;">
            <div class="acta-card">
              <div class="acta-card-title">Memory</div>
              <div class="acta-metric-value" style="margin-bottom:0.5rem;">${memPct !== null ? memPct.toFixed(1) + '%' : '—'}</div>
              <div class="acta-progress"><div class="acta-progress-fill ${memPct > 85 ? 'alert' : memPct > 70 ? 'warning' : ''}" style="width:${memPct || 0}%"></div></div>
              <div class="acta-metric-sub" style="margin-top:0.5rem;">${fmtBytes(sys.memory && sys.memory.used_mb)} / ${fmtBytes(sys.memory && sys.memory.total_mb)}</div>
            </div>
            <div class="acta-card">
              <div class="acta-card-title">Disk</div>
              <div class="acta-metric-value" style="margin-bottom:0.5rem;">${diskPct !== null ? diskPct.toFixed(1) + '%' : '—'}</div>
              <div class="acta-progress"><div class="acta-progress-fill ${diskPct > 85 ? 'alert' : diskPct > 70 ? 'warning' : ''}" style="width:${diskPct || 0}%"></div></div>
              <div class="acta-metric-sub" style="margin-top:0.5rem;">${fmt(sys.disk && sys.disk.used_gb, 1)} / ${fmt(sys.disk && sys.disk.total_gb, 1)} GB</div>
            </div>
            <div class="acta-card">
              <div class="acta-card-title">Storage Box</div>
              <div class="acta-metric-value" style="margin-bottom:0.5rem;">${storagePct !== null ? storagePct + '%' : '—'}</div>
              <div class="acta-progress"><div class="acta-progress-fill teal" style="width:${storagePct || 0}%"></div></div>
              <div class="acta-metric-sub" style="margin-top:0.5rem;">${fmt(storage.used_gb, 1)} / ${fmt(storage.total_gb, 1)} GB</div>
            </div>
          </div>

          <!-- Ports + Security -->
          <div class="acta-grid acta-grid-2">
            <div class="acta-card">
              <div class="acta-card-title">Offene Ports</div>
              <div class="acta-detail-list">
                ${(sec.open_ports || []).map(p => `<div class="acta-detail-item"><div class="acta-detail-value">${p}</div></div>`).join('') || '<div class="acta-empty">Keine offenen Ports</div>'}
              </div>
            </div>
            <div class="acta-card">
              <div class="acta-card-title">Security</div>
              <div class="acta-detail-list">
                <div class="acta-detail-item"><div class="acta-detail-label">Monarx</div><div class="acta-detail-value">${(sec.monarx && sec.monarx.status) || '—'}</div></div>
                <div class="acta-detail-item"><div class="acta-detail-label">Letzter Sync</div><div class="acta-detail-value">${(storage.last_sync || '—').slice(0, 80)}</div></div>
              </div>
            </div>
          </div>
        `;

        // ---- Chart-Defaults (verhindern den Endlos-Grow) ----
        Chart.defaults.maintainAspectRatio = false;
        Chart.defaults.responsive = true;
        Chart.defaults.plugins.legend.labels.color = '#8A9BA8';

        // ---- 14-Tage-Verlauf (Line + Bar, dual axis) ----
        if (history.length) {
          charts.trend = new Chart(document.getElementById('trendChart'), {
            data: {
              labels: history.map(h => h.label),
              datasets: [
                {
                  type: 'line', label: 'Weekly Usage %',
                  data: history.map(h => h.usage_pct),
                  borderColor: ACTA.petroleum, backgroundColor: 'rgba(44,95,124,0.12)',
                  borderWidth: 2.5, tension: 0.3, fill: true, pointRadius: 3,
                  pointBackgroundColor: ACTA.petroleum, yAxisID: 'y'
                },
                {
                  type: 'bar', label: 'Requests',
                  data: history.map(h => h.requests),
                  backgroundColor: 'rgba(61,139,139,0.35)', borderWidth: 0,
                  yAxisID: 'y1', order: 2
                }
              ]
            },
            options: {
              interaction: { mode: 'index', intersect: false },
              plugins: {
                legend: { position: 'top' },
                tooltip: {
                  callbacks: {
                    afterLabel: (ctx) => {
                      const h = history[ctx.dataIndex];
                      return h ? ('Modell top: ' + (h.top_model || '—')) : '';
                    }
                  }
                }
              },
              scales: {
                x: { grid: { display: false }, ticks: { color: '#8A9BA8', maxRotation: 0, autoSkip: true } },
                y: { position: 'left', beginAtZero: true, max: 100,
                     title: { display: true, text: 'Usage %', color: '#8A9BA8' },
                     ticks: { color: '#8A9BA8', callback: v => v + '%' }, grid: { color: 'rgba(138,155,168,0.15)' } },
                y1: { position: 'right', beginAtZero: true,
                      title: { display: true, text: 'Requests', color: '#8A9BA8' },
                      ticks: { color: '#8A9BA8' }, grid: { display: false } }
              }
            }
          });
        }

        // ---- Modell-Doughnut ----
        const models = ollama.models || [];
        if (models.length) {
          charts.model = new Chart(document.getElementById('modelChart'), {
            type: 'doughnut',
            data: {
              labels: models.map(x => x.name),
              datasets: [{ data: models.map(x => x.request_count),
                           backgroundColor: PALETTE, borderWidth: 0 }]
            },
            options: { cutout: '58%', plugins: { legend: { position: 'bottom' } } }
          });
        }

        // ---- Container-Doughnut ----
        charts.container = new Chart(document.getElementById('containerChart'), {
          type: 'doughnut',
          data: {
            labels: ['Running', 'Gestoppt'],
            datasets: [{ data: [running, stopped],
                         backgroundColor: [ACTA.success, ACTA.alert], borderWidth: 0 }]
          },
          options: { cutout: '58%', plugins: { legend: { position: 'bottom' } } }
        });

      } catch (e) {
        content.innerHTML = '<div class="acta-empty">Fehler beim Laden: ' + e.message + '</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
