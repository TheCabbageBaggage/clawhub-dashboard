<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clowie Health Dashboard</title>
<style>
  :root {
    --green: #2ecc71;
    --yellow: #f1c40f;
    --red: #e74c3c;
    --bg: #0f1923;
    --card: #1a2d3d;
    --text: #e0e6ed;
    --muted: #8899aa;
    --border: #2a3d4d;
    --accent: #3498db;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
  }

  /* Layout */
  header {
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  /* Status badge */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    border-radius: 100px;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.5px;
  }
  .status-badge.green { background: #1a3a2a; color: var(--green); border: 1px solid var(--green); }
  .status-badge.yellow { background: #3a3520; color: var(--yellow); border: 1px solid var(--yellow); }
  .status-badge.red { background: #3a2020; color: var(--red); border: 1px solid var(--red); }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
  .dot.red { background: var(--red); box-shadow: 0 0 8px var(--red); }

  /* Quick Stats */
  .stats-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin: 20px 0;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    flex: 1;
    min-width: 120px;
  }
  .stat-card .value { font-size: 1.8rem; font-weight: 700; }
  .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  /* Check Cards Grid */
  .checks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .check-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
  }
  .check-card:hover {
    border-color: #4a6a8a;
    transform: translateY(-1px);
  }
  .check-card h3 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .check-card .message {
    font-size: 0.9rem;
    margin: 4px 0;
    line-height: 1.4;
  }
  .check-card .detail {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 6px;
    white-space: pre-wrap;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, margin-top 0.2s ease;
  }
  .check-card .detail.open {
    max-height: 200px;
    margin-top: 8px;
  }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .filter-btn:hover { background: #2a4a6a; }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Sections */
  .section {
    margin-top: 24px;
  }
  .section h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--muted);
  }

  /* Remediation / Error Items */
  .remediation-item, .error-item {
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 4px;
    font-size: 0.85rem;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .remediation-item.success {
    background: #1a3a2a;
    border-left: 3px solid var(--green);
  }
  .remediation-item.fail {
    background: #3a2a20;
    border-left: 3px solid var(--yellow);
  }
  .error-item {
    background: #3a2020;
    border-left: 3px solid var(--red);
  }

  /* Refresh bar */
  .refresh-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .refresh-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  .refresh-btn:hover { background: #2a4a6a; }
  .refresh-btn:active { transform: scale(0.97); }
  .last-updated {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .auto-refresh-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    margin-top: 60px;
  }
  .empty-state h2 { font-size: 1.3rem; margin-bottom: 8px; }
  .empty-state code {
    background: var(--card);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 0.85rem;
  }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .checks-grid { grid-template-columns: 1fr; }
    .stats-row .stat-card { min-width: 80px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="refresh-bar">
      <div>
        <h1>🩺 Clowie Health</h1>
        <div class="subtitle" id="timestamp">Loading...</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="last-updated" id="auto-refresh-label">
          <span class="auto-refresh-dot"></span> Auto-refresh
        </span>
        <button class="refresh-btn" onclick="location.reload()">⟳ Refresh</button>
      </div>
    </div>
    <div id="status-badge"></div>
  </header>

  <div class="stats-row" id="stats"></div>

  <div class="section">
    <h2>🔍 System Checks</h2>
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="green">🟢 Green</button>
      <button class="filter-btn" data-status="yellow">🟡 Yellow</button>
      <button class="filter-btn" data-status="red">🔴 Red</button>
    </div>
    <div class="checks-grid" id="checks"></div>
  </div>

  <div class="section" id="remediations-section" style="display:none">
    <h2>🔧 Auto-Remediations</h2>
    <div id="remediations"></div>
  </div>

  <div class="section" id="errors-section" style="display:none">
    <h2>⚠️ Errors</h2>
    <div id="errors"></div>
  </div>
</div>

<script>
async function load() {
  try {
    const resp = await fetch('last_report.json?_=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    render(data);
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="empty-state">
        <h2>📡 Waiting for first report...</h2>
        <p style="color:var(--muted);margin-top:8px">
          Run <code>python3 scripts/health/health_monitor.py</code> to generate a report
        </p>
      </div>`;
  }
}

function getStatusColor(s) {
  if (s === 'green') return '#2ecc71';
  if (s === 'yellow') return '#f1c40f';
  return '#e74c3c';
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function render(data) {
  // Timestamp
  const ts = document.getElementById('timestamp');
  const reportTime = new Date(data.timestamp);
  const now = new Date();
  const ageMin = Math.round((now - reportTime) / 60000);
  let ageText = ageMin < 1 ? 'just now' : ageMin < 60 ? `${ageMin}m ago` : `${Math.round(ageMin/60)}h ago`;
  ts.textContent = `Report: ${data.timestamp} · Host: ${data.hostname} · ${ageText}`;

  // Overall badge
  document.getElementById('status-badge').innerHTML =
    `<span class="status-badge ${data.overall}">
      <span class="dot ${data.overall}"></span>
      ${data.overall.toUpperCase()}
     </span>`;

  // Stats
  const statuses = {};
  for (const c of Object.values(data.checks)) {
    statuses[c.status] = (statuses[c.status] || 0) + 1;
  }
  document.getElementById('stats').innerHTML =
    `<div class="stat-card"><div class="value" style="color:var(--green)">${statuses.green || 0}</div><div class="label">Green</div></div>
     <div class="stat-card"><div class="value" style="color:var(--yellow)">${statuses.yellow || 0}</div><div class="label">Yellow</div></div>
     <div class="stat-card"><div class="value" style="color:var(--red)">${statuses.red || 0}</div><div class="label">Red</div></div>
     <div class="stat-card"><div class="value">${(data.remediations || []).length}</div><div class="label">Auto-Fixes</div></div>
     <div class="stat-card"><div class="value">${(data.errors || []).length}</div><div class="label">Errors</div></div>`;

  // Check cards
  const checksContainer = document.getElementById('checks');
  checksContainer.innerHTML = '';
  for (const [name, check] of Object.entries(data.checks)) {
    const card = document.createElement('div');
    card.className = 'check-card';
    card.dataset.status = check.status;

    let detailContent = check.detail
      ? escapeHtml(typeof check.detail === 'string' ? check.detail : JSON.stringify(check.detail, null, 2))
      : '';

    card.innerHTML = `
      <h3><span class="dot ${check.status}"></span>${escapeHtml(name)}</h3>
      <div class="message">${escapeHtml(check.message || 'No message')}</div>
      ${detailContent ? `<div class="detail" id="detail-${escapeHtml(name.replace(/\s/g, '_'))}">${detailContent}</div>` : ''}
    `;

    // Toggle detail on click
    card.addEventListener('click', () => {
      const detail = card.querySelector('.detail');
      if (detail) detail.classList.toggle('open');
    });

    checksContainer.appendChild(card);
  }

  // Remediations
  const remSection = document.getElementById('remediations-section');
  const remContainer = document.getElementById('remediations');
  if (data.remediations && data.remediations.length) {
    remSection.style.display = 'block';
    remContainer.innerHTML = data.remediations.map(r =>
      `<div class="remediation-item ${r.success ? 'success' : 'fail'}">
        <span>${r.success ? '✅' : '⚠️'}</span>
        <div><strong>${escapeHtml(r.action)}</strong>: ${escapeHtml(r.result).substring(0, 200)}</div>
      </div>`
    ).join('');
  } else {
    remSection.style.display = 'none';
  }

  // Errors
  const errSection = document.getElementById('errors-section');
  const errContainer = document.getElementById('errors');
  if (data.errors && data.errors.length) {
    errSection.style.display = 'block';
    errContainer.innerHTML = data.errors.map(e =>
      `<div class="error-item">
        <span>❌</span>
        <div><strong>${escapeHtml(e.context)}</strong>: ${escapeHtml(e.error)}</div>
      </div>`
    ).join('');
  } else {
    errSection.style.display = 'none';
  }
}

// Filter
document.getElementById('filter-bar').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;

  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const status = btn.dataset.status;
  document.querySelectorAll('.check-card').forEach(card => {
    card.style.display = (status === 'all' || card.dataset.status === status) ? '' : 'none';
  });
});

load();
// Auto-refresh every 3 minutes
setInterval(load, 180000);
</script>
</body>
</html>
