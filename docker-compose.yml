services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clawhub-dashboard
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - dashboard-data:/app/data
      - ./dashboard:/app/dashboard:ro
      - ./auth.json:/app/data/auth.json:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - ollama-xwy9_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clawhub.rule=Host(`clawhub.cabbagebaggage.net`)"
      - "traefik.http.routers.clawhub.entrypoints=web"
      - "traefik.http.services.clawhub.loadbalancer.server.port=3001"

volumes:
  dashboard-data:

networks:
  ollama-xwy9_default:
    external: true
