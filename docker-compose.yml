services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clawhub-dashboard
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - dashboard-data:/app/data
      - ./dashboard:/app/dashboard:ro
      - ./auth.json:/app/data/auth.json:ro
      - ./tasks.db:/app/data/tasks.db:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TASK_DB_PATH=/app/data/tasks.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    networks:
      - ollama-xwy9_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clawhub-http.rule=Host(`claw.lkohl.duckdns.org`)"
      - "traefik.http.routers.clawhub-http.entrypoints=web"
      - "traefik.http.routers.clawhub-http.middlewares=clawhub-redirect"
      - "traefik.http.routers.clawhub-http.service=clawhub-svc"
      - "traefik.http.routers.clawhub-https.rule=Host(`claw.lkohl.duckdns.org`)"
      - "traefik.http.routers.clawhub-https.entrypoints=websecure"
      - "traefik.http.routers.clawhub-https.tls=true"
      - "traefik.http.routers.clawhub-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.clawhub-https.service=clawhub-svc"
      - "traefik.http.services.clawhub-svc.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.clawhub-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.clawhub-redirect.redirectscheme.permanent=true"

volumes:
  dashboard-data:

networks:
  ollama-xwy9_default:
    external: true
