<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawHub — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0f1419;
            color: #e7e9ea;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-container {
            background: #1a1f26;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #3D8B8B;
            letter-spacing: -0.5px;
        }
        
        .logo p {
            color: #71767b;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #536471;
            font-size: 13px;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #2f3336;
        }
        
        .divider span {
            padding: 0 12px;
        }
        
        .btn-oauth {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #1a1f26;
            border: 1px solid #2f3336;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-oauth:hover {
            background: #f0f0f0;
        }
        
        .btn-oauth:active {
            transform: scale(0.98);
        }
        
        .btn-oauth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-oauth svg {
            width: 20px;
            height: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #71767b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f1419;
            border: 1px solid #2f3336;
            border-radius: 8px;
            color: #e7e9ea;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #3D8B8B;
            box-shadow: 0 0 0 2px rgba(61, 139, 139, 0.2);
        }
        
        .form-group input::placeholder {
            color: #536471;
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #3D8B8B;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        
        .btn-login:hover {
            background: #4a9e9e;
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }
        
        .btn-login:disabled {
            background: #2f3336;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: rgba(244, 33, 46, 0.1);
            border: 1px solid rgba(244, 33, 46, 0.3);
            color: #f4212e;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.visible {
            display: block;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #536471;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🦞 ClawHub</h1>
            <p>Secure Dashboard Access</p>
        </div>
        
        <div id="error" class="error-message"></div>
        
        <!-- Authentik SSO -->
        <button type="button" class="btn-oauth" id="authentikBtn" onclick="handleAuthentikLogin()">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#FD4B2D" d="M12 1.5L2.5 5.5v6c0 5.2 3.9 9.4 9.5 11 5.6-1.6 9.5-5.8 9.5-11v-6L12 1.5z"/><path fill="#fff" d="M12 4.5l6.5 2.6v4.4c0 3.9-2.9 7.1-6.5 8.4-3.6-1.3-6.5-4.5-6.5-8.4V7.1L12 4.5z"/><path fill="#FD4B2D" d="M12 7.2l4.2 1.7v2.9c0 2.5-1.9 4.6-4.2 5.4-2.3-.8-4.2-2.9-4.2-5.4V8.9L12 7.2z"/><path fill="#fff" d="M12 9.5l1.8.7v1.2c0 1.1-.8 2-1.8 2.3-1-.3-1.8-1.2-1.8-2.3v-1.2L12 9.5z"/></svg>
            Sign in with Authentik
        </button>
        
        <div class="divider"><span>or</span></div>
        
        <!-- Password Login -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" 
                       placeholder="Enter your username" 
                       autocomplete="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" 
                       placeholder="Enter your password" 
                       autocomplete="current-password" required>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                Sign In
            </button>
        </form>
        
        <div class="footer">
            ClawHub Dashboard &copy; 2026
        </div>
    </div>
    
    <script>
        // Authentik SSO login (redirect to server, which redirects to Authentik)
        function handleAuthentikLogin() {
            const btn = document.getElementById('authentikBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Redirecting to Authentik...';
            window.location.href = '/api/auth/authentik/login';
        }
        
        // Password login
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');
        const loginBtn = document.getElementById('loginBtn');
        
        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.add('visible');
        }
        
        function hideError() {
            errorEl.classList.remove('visible');
        }
        
        function setLoading(loading) {
            loginBtn.disabled = loading;
            loginBtn.innerHTML = loading 
                ? '<span class="spinner"></span>Signing in...' 
                : 'Sign In';
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Invalid credentials.');
                }
            } catch (err) {
                showError('Connection error. Please try again.');
            } finally {
                setLoading(false);
            }
        });
        
        // Check if already logged in
        (async () => {
            try {
                const response = await fetch('/api/auth-status');
                const data = await response.json();
                if (data.authenticated) {
                    window.location.href = '/';
                }
            } catch (e) {}
        })();
        
    </script>
</body>
</html>
