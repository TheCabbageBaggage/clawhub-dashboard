<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawHub — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0f1419;
            color: #e7e9ea;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-container {
            background: #1a1f26;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #3D8B8B;
            letter-spacing: -0.5px;
        }
        
        .logo p {
            color: #71767b;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #536471;
            font-size: 13px;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #2f3336;
        }
        
        .divider span {
            padding: 0 12px;
        }
        
        .btn-google {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #1a1f26;
            border: 1px solid #2f3336;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-google:hover {
            background: #f0f0f0;
        }
        
        .btn-google:active {
            transform: scale(0.98);
        }
        
        .btn-google:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-google svg {
            width: 20px;
            height: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #71767b;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f1419;
            border: 1px solid #2f3336;
            border-radius: 8px;
            color: #e7e9ea;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #3D8B8B;
            box-shadow: 0 0 0 2px rgba(61, 139, 139, 0.2);
        }
        
        .form-group input::placeholder {
            color: #536471;
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #3D8B8B;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        
        .btn-login:hover {
            background: #4a9e9e;
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }
        
        .btn-login:disabled {
            background: #2f3336;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: rgba(244, 33, 46, 0.1);
            border: 1px solid rgba(244, 33, 46, 0.3);
            color: #f4212e;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.visible {
            display: block;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #536471;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🦞 ClawHub</h1>
            <p>Secure Dashboard Access</p>
        </div>
        
        <div id="error" class="error-message"></div>
        
        <!-- Google Sign-In -->
        <button type="button" class="btn-google" id="googleBtn" onclick="handleGoogleLogin()">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Sign in with Google
        </button>
        
        <div class="divider"><span>or</span></div>
        
        <!-- Password Login -->
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" 
                       placeholder="Enter your username" 
                       autocomplete="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" 
                       placeholder="Enter your password" 
                       autocomplete="current-password" required>
            </div>
            
            <button type="submit" class="btn-login" id="loginBtn">
                Sign In
            </button>
        </form>
        
        <div class="footer">
            ClawHub Dashboard &copy; 2026
        </div>
    </div>
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        let googleClientId = '';
        let googleInitialized = false;
        
        // Fetch Google client ID from server
        async function initGoogleAuth() {
            try {
                const resp = await fetch('/api/auth/google-config');
                const data = await resp.json();
                googleClientId = data.clientId;
                
                if (googleClientId && window.google) {
                    google.accounts.id.initialize({
                        client_id: googleClientId,
                        callback: handleGoogleResponse,
                        auto_select: false,
                        cancel_on_tap_outside: true
                    });
                    googleInitialized = true;
                }
            } catch (e) {
                console.error('Failed to init Google auth:', e);
            }
        }
        
        function handleGoogleLogin() {
            if (!googleInitialized || !window.google) {
                showError('Google Sign-In is not available. Please use password login.');
                return;
            }
            setGoogleLoading(true);
            google.accounts.id.prompt();
        }
        
        async function handleGoogleResponse(response) {
            if (response.error) {
                setGoogleLoading(false);
                showError('Google Sign-In was cancelled or failed.');
                return;
            }
            
            try {
                const resp = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                
                const data = await resp.json();
                
                if (resp.ok && data.success) {
                    window.location.href = '/';
                } else {
                    setGoogleLoading(false);
                    showError(data.error || 'Google authentication failed.');
                }
            } catch (err) {
                setGoogleLoading(false);
                showError('Connection error. Please try again.');
            }
        }
        
        function setGoogleLoading(loading) {
            const btn = document.getElementById('googleBtn');
            btn.disabled = loading;
            btn.innerHTML = loading 
                ? '<span class="spinner"></span>Signing in...' 
                : '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Sign in with Google';
        }
        
        // Password login
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');
        const loginBtn = document.getElementById('loginBtn');
        
        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.add('visible');
        }
        
        function hideError() {
            errorEl.classList.remove('visible');
        }
        
        function setLoading(loading) {
            loginBtn.disabled = loading;
            loginBtn.innerHTML = loading 
                ? '<span class="spinner"></span>Signing in...' 
                : 'Sign In';
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Invalid credentials.');
                }
            } catch (err) {
                showError('Connection error. Please try again.');
            } finally {
                setLoading(false);
            }
        });
        
        // Check if already logged in
        (async () => {
            try {
                const response = await fetch('/api/auth-status');
                const data = await response.json();
                if (data.authenticated) {
                    window.location.href = '/';
                }
            } catch (e) {}
        })();
        
        // Init Google auth
        initGoogleAuth();
    </script>
</body>
</html>
